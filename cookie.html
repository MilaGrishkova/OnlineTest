<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=0.5" />
  <title>cookie</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #f7f7f7;
      background-image: url('assets/images/your-background.jpg'); /* фон */
      background-size: cover;
      background-position: center;
    }

    main {
      max-width: 800px;
      margin: 60px auto;
      background: rgba(0, 0, 80, 0.85);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px #0044cc;
      color: #e0eaff;
    }

    h1, h2 {
      color: #00aaff;
    }

    button, .btn {
      background-color: #005fbb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-weight: bold;
      cursor: pointer;
      margin-left: 10px;
      transition: background-color 0.3s ease;
    }

    button:hover, .btn:hover {
      background-color: #3399ff;
      color: #000;
    }

    /* Cookie Consent Banner */
    #cookie-consent {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(0, 95, 187, 0.95);
      color: white;
      padding: 15px 25px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      backdrop-filter: blur(5px);
      z-index: 10000;
      box-shadow: 0 -3px 10px rgba(0,0,0,0.7);
    }

    #cookie-consent p {
      margin: 0;
      flex: 1 1 60%;
      min-width: 250px;
    }

    #cookie-consent .buttons {
      flex: 1 1 30%;
      display: flex;
      justify-content: flex-end;
      min-width: 200px;
    }

    @media (max-width: 480px) {
      #cookie-consent {
        flex-direction: column;
        font-size: 14px;
      }
      #cookie-consent .buttons {
        justify-content: center;
        margin-top: 10px;
      }
      #cookie-consent p {
        flex: none;
        margin-bottom: 10px;
      }
    }
  </style>
</head>
<body>

<main>
  <h1>Dein Test</h1>
  <p>Hier kommt dein Test-Inhalt...</p>
</main>

<!-- Cookie Consent Banner -->
<div id="cookie-consent" style="display:none;">
  <p>Wir verwenden Cookies, um dir das beste Nutzererlebnis zu bieten und um die Nutzung unserer Website zu analysieren. Durch Klicken auf "Akzeptieren" stimmst du der Verwendung von Cookies gemäß unserer <a href="datenschutz.html" style="color:#cce6ff; text-decoration:underline;">Datenschutzerklärung</a> zu.</p>
  <div class="buttons">
    <button id="accept-cookies">Akzeptieren</button>
    <button id="reject-cookies">Ablehnen</button>
  </div>
</div>

<script>
  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
    return null;
  }

  function setCookie(name, value, days) {
    const expires = new Date(Date.now() + days*24*60*60*1000).toUTCString();
    document.cookie = `${name}=${value}; expires=${expires}; path=/; SameSite=Lax`;
  }

  function showConsent() {
    document.getElementById('cookie-consent').style.display = 'flex';
  }

  function hideConsent() {
    document.getElementById('cookie-consent').style.display = 'none';
  }

  window.addEventListener('DOMContentLoaded', () => {
    const consent = getCookie('eu_cookie_consent');
    if (!consent) {
      showConsent();
    }
  });

  document.getElementById('accept-cookies').addEventListener('click', () => {
    setCookie('eu_cookie_consent', 'accepted', 365);
    hideConsent();
  });

  document.getElementById('reject-cookies').addEventListener('click', () => {
    setCookie('eu_cookie_consent', 'rejected', 365);
    hideConsent();
  });
</script>
</body>
</html>
