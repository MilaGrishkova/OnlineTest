function shuffleArray(array) {
  return array
    .map(value => ({ value, sort: Math.random() }))
    .sort((a, b) => a.sort - b.sort)
    .map(({ value }) => value);
}

if (!localStorage.getItem('quizOrder')) {
  const shuffledOrder = shuffleArray([...Array(questionsData.length).keys()]);
  localStorage.setItem('quizOrder', JSON.stringify(shuffledOrder));
}

const params = new URLSearchParams(window.location.search);
const qIndex = parseInt(params.get('q')) || 0;
const order = JSON.parse(localStorage.getItem('quizOrder')) || [];

if (qIndex >= order.length) {
  location.href = 'result.html';
}

const questionId = order[qIndex];
const question = questionsData[questionId];

question.answers = shuffleArray(question.answers);

document.getElementById('questionTitle').textContent = `Frage ${qIndex + 1}`;
document.getElementById('questionText').textContent = question.question;
document.getElementById('questionImg').src = question.img;
document.getElementById('questionImg').alt = question.question;

const answersDiv = document.getElementById('answers');
answersDiv.innerHTML = '';

question.answers.forEach((a, i) => {
  const id = `answer${i}`;
  const label = document.createElement('label');
  label.htmlFor = id;
  label.innerHTML = `<input type="checkbox" name="answer" id="${id}" value="${a.correct}"> ${a.text}`;
  answersDiv.appendChild(label);
});

document.querySelectorAll('input[type="checkbox"][name="answer"]').forEach(checkbox => {
  checkbox.addEventListener('change', () => {
    const checked = document.querySelectorAll('input[type="checkbox"][name="answer"]:checked');
    if (checked.length > 4) {
      checkbox.checked = false;
      alert('Sie dürfen höchstens 4 Antworten auswählen.');
    }
  });
});

function submitAnswer() {
  const form = document.getElementById('answerForm');
  const selectedInputs = Array.from(form.querySelectorAll('input[name="answer"]:checked'));

  if (selectedInputs.length === 0) {
    alert('Bitte wählen Sie mindestens eine Antwort.');
    return;
  }

  const correctAnswers = question.answers.filter(a => a.correct);
  const correctSet = new Set(correctAnswers.map(a => a.text));

  const selectedSet = new Set(selectedInputs.map(input => {
    const label = input.closest('label');
    return label.textContent.trim();
  }));

  let correctSelected = 0;
  let wrongSelected = 0;

  selectedSet.forEach(answer => {
    if (correctSet.has(answer)) {
      correctSelected++;
    } else {
      wrongSelected++; 
    }
  });


  correctSet.forEach(correct => {
    if (!selectedSet.has(correct)) {
      wrongSelected++; 
    }
  });

  let totalCorrect = parseInt(localStorage.getItem('correctAnswers')) || 0;
  let totalWrong = parseInt(localStorage.getItem('wrongAnswers')) || 0;

  totalCorrect += correctSelected;
  totalWrong += wrongSelected;

  localStorage.setItem('correctAnswers', totalCorrect);
  localStorage.setItem('wrongAnswers', totalWrong);


  if (totalWrong >= 10) {
    const modal = document.getElementById('modal');
    modal.style.display = 'flex';

    setTimeout(() => {
      location.href = 'result.html';
    }, 2000); 

    return;
  }


  const currentIndex = parseInt(new URLSearchParams(window.location.search).get('q')) || 0;

const correctAnswerText = correctAnswers.map(a => `<p>${a.text}</p>`).join('');
  const query = new URLSearchParams({
    q: currentIndex,
    correct: totalCorrect,
    wrong: totalWrong,
    correctAnswer: correctAnswerText
  });

  location.href = `answer.html?${query.toString()}`;
}

</script>
